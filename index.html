<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi Karyawan JSKN</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#800000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Absensi">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    video { transform: scaleX(-1); }
    #canvas { transform: scaleX(-1); }
    * { -webkit-tap-highlight-color: transparent; }
    .dark { color-scheme: dark; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white transition">
  <div id="app"></div>

  <div id="installPopup" class="fixed inset-0 bg-black/95 backdrop-blur-sm hidden items-center justify-center p-4 z-[9999]">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
      <div class="w-20 h-20 bg-red-800 rounded-3xl mx-auto flex items-center justify-center mb-4 animate-bounce">
        <i class="fa-solid fa-download text-white text-3xl"></i>
      </div>
      <h3 id="installTitle" class="text-xl font-black text-gray-900 dark:text-white mb-2">Install Aplikasi Dulu</h3>
      <p id="installDesc" class="text-sm text-gray-600 dark:text-gray-400 mb-6">Untuk absen, aplikasi harus diinstall ke HP kamu.</p>
      <button id="btnInstallAndroid" class="hidden w-full bg-red-800 hover:bg-red-900 text-white py-4 rounded-2xl font-bold text-lg mb-2">
        <i class="fa-solid fa-download mr-2"></i>Install Sekarang
      </button>
      <button id="btnInstallIOS" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold mb-2">
        <i class="fa-solid fa-share-from-square mr-2"></i>Lihat Cara Install
      </button>
      <div id="iosSteps" class="hidden text-left bg-gray-100 dark:bg-gray-700 p-3 rounded-xl text-xs mb-2">
        1. Tap tombol <b>Share</b> di Safari<br>
        2. Pilih <b>Add to Home Screen</b><br>
        3. Tap <b>Add</b>, buka dari Home
      </div>
      <p class="text-xs text-gray-500 mt-2">Setelah install, buka dari Home Screen</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
